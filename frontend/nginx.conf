# SPA + reverse proxy to the backend (same origin => no CORS in M0).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location /ready {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
